# VexiiRiscv CPU config for the ChisBurner hardware profile.
# Keep the proven single-issue Pocket configuration while the cartridge path
# is brought up.  The smaller D-cache leaves ample FPGA margin for the later
# GB/GBC and GBA read sequencers without changing the firmware ABI.

ICACHE_SETS=256
DCACHE_SETS=512
GSHARE_BYTES=1024
BTB_SETS=256
LSU_SW_PREFETCH=0
EXTRA_FLAGS=""
MAXFAN_HINT=16
